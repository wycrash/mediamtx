openapi: 3.0.0

info:
  version: 1.0.0
  title: MediaMTX API
  description: API of MediaMTX, a server and proxy that supports various protocols.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:9997

security: []

components:
  schemas:
    HLSVariant:
      type: string
      enum: [mpegts, fmp4, lowLatency]

    LogDestination:
      type: string
      enum: [stdout, file, syslog]

    LogLevel:
      type: string
      enum: [error, warn, info, debug]

    RTSPAuthMethod:
      type: string
      enum: [basic, digest]

    RTSPTransport:
      type: string
      enum: [udp, multicast, tcp, automatic]

    PathTrackCodecProps:
      oneOf:
        - $ref: "#/components/schemas/PathTrackCodecPropsAV1"
        - $ref: "#/components/schemas/PathTrackCodecPropsVP9"
        - $ref: "#/components/schemas/PathTrackCodecPropsH265"
        - $ref: "#/components/schemas/PathTrackCodecPropsH264"
        - $ref: "#/components/schemas/PathTrackCodecPropsOpus"
        - $ref: "#/components/schemas/PathTrackCodecPropsMPEG4Audio"
        - $ref: "#/components/schemas/PathTrackCodecPropsAC3"
        - $ref: "#/components/schemas/PathTrackCodecPropsG711"
        - $ref: "#/components/schemas/PathTrackCodecPropsLPCM"

    ForwardDestTypeSpecific:
      oneOf:
        - $ref: "#/components/schemas/ForwardDestTypeSpecificRTMP"
        - $ref: "#/components/schemas/ForwardDestTypeSpecificMoQ"
        - $ref: "#/components/schemas/ForwardDestTypeSpecificRTSP"
        - $ref: "#/components/schemas/ForwardDestTypeSpecificSRT"
        - $ref: "#/components/schemas/ForwardDestTypeSpecificWebRTC"

    StaticSourceTypeSpecific:
      oneOf:
        - $ref: "#/components/schemas/StaticSourceTypeSpecificRTMP"
        - $ref: "#/components/schemas/StaticSourceTypeSpecificMoQ"
        - $ref: "#/components/schemas/StaticSourceTypeSpecificRTSP"
        - $ref: "#/components/schemas/StaticSourceTypeSpecificSRT"
        - $ref: "#/components/schemas/StaticSourceTypeSpecificWebRTC"

    OnvifFound:
      type: object
      description: One camera announced by WS-Discovery.
      properties:
        address:
          type: string
          description: First device service URL.
        name:
          type: string
          description: Scope name. Omitted when the camera does not advertise one.
        hardware:
          type: string
          description: Scope hardware. Omitted when the camera does not advertise one.
        type:
          type: string
          description: camera, nvr, display, or analytics. Omitted when the device does not advertise a known type. A recorder wins over a transmitter.
          enum: [camera, nvr, display, analytics]
        xaddrs:
          type: array
          description: Device service URLs. Omitted when empty.
          items:
            type: string
        owner:
          type: string
          description: Path that owns this camera. Empty when no configured path has this address.
        paths:
          type: array
          description: Owner path and streams linked to it with onvifPath. Empty when owner is empty.
          items:
            type: string
        rtsp:
          type: boolean
          description: True when the owner or a linked path has an RTSP source.

    OnvifDiscovery:
      type: object
      description: Snapshot of the discovery scan. Poll while running is true.
      properties:
        running:
          type: boolean
          description: True while the scan is still listening.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/OnvifFound"
        error:
          type: string
          description: Set when the scan fails. Omitted after a successful scan.

    OnvifProbeRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Camera URL, for example http://192.168.1.100:8000. The device service path is appended when missing.
        user:
          type: string
        pass:
          type: string
          description: Used for this request only. It is not stored.

    OnvifProfile:
      type: object
      description: Field names match the encoded Go struct.
      properties:
        Token:
          type: string
        Name:
          type: string
        Role:
          type: string
          description: main, sub, or an empty string for any other profile.
        Width:
          type: integer
          format: int64
        Height:
          type: integer
          format: int64
        StreamURI:
          type: string
          description: RTSP URI returned by the camera, without injected credentials.

    OnvifProbe:
      type: object
      description: Field names match the encoded Go struct. The password is not returned.
      properties:
        Endpoint:
          type: string
          description: Canonical device service URL.
        Key:
          type: string
          description: scheme://host:port. Paths that share this key are one camera.
        Manufacturer:
          type: string
        Model:
          type: string
        Firmware:
          type: string
        Serial:
          type: string
        Events:
          type: boolean
          description: True when the camera exposes an event service.
        Topics:
          type: array
          description: Concrete event topics reported by GetEventProperties. Each entry is a path that can be used in onvifEventTopics.
          items:
            type: string
        Profiles:
          type: array
          items:
            $ref: "#/components/schemas/OnvifProfile"

    OnvifStreamRequest:
      type: object
      properties:
        profile:
          type: string
          description: main, sub, a profile token, or a profile name. Empty means main.
        name:
          type: string
          description: Path name. The owner uses the request name when this is empty. Another stream becomes {name}-sub.
        record:
          type: boolean
          nullable: true
          description: Empty means false.
        events:
          type: boolean
          nullable: true
          description: Empty means true on the owner. The first stream with events true becomes the owner.

    OnvifPathsAddRequest:
      type: object
      required: [name, address, streams]
      properties:
        name:
          type: string
          description: Name of the owner path, or of the single extra stream when the camera is already owned.
        address:
          type: string
        user:
          type: string
        pass:
          type: string
          description: Stored on the owner path. It is not stored when the camera already has an owner.
        streams:
          type: array
          minItems: 1
          description: Only the listed streams are created.
          items:
            $ref: "#/components/schemas/OnvifStreamRequest"

    OnvifPathsAdd:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string

    OnvifDevice:
      type: object
      description: Camera derived from configured paths. There is no separate device registry.
      properties:
        address:
          type: string
        owner:
          type: string
          description: Path that owns the subscription.
        paths:
          type: array
          items:
            type: string
        subscribed:
          type: boolean
        eventsSupported:
          type: boolean
        lastError:
          type: string
          description: Omitted when the session has no error.
        dropped:
          type: integer
          format: uint64
          description: Notifications dropped because the event queue was full.

    OnvifDeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/OnvifDevice"

    OnvifStatus:
      type: object
      properties:
        enabled:
          type: boolean
        sessions:
          type: integer
          format: int64
        dropped:
          type: integer
          format: uint64
        unsupported:
          type: integer
          format: int64
          description: Sessions whose camera has no event service.

    OnvifEvent:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Server receive time, unix seconds.
        duration:
          type: integer
          format: int64
          description: Seconds. Zero for a point event such as a line crossing.
        class:
          type: string
          description: motion, line, field, input, tamper, or other.
        topic:
          type: string
        source:
          type: string

    OnvifEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/OnvifEvent"

paths:
  /v3/info:
    get:
      operationId: info
      tags: [General]
      summary: returns informations about the instance.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/logs/list:
    get:
      operationId: logsList
      tags: [General]
      summary: returns recent log entries from the in-memory ring.
      description: Newest entries first. Only lines that passed logLevel are stored. The buffer keeps the last 2048 entries and is cleared on restart.
      parameters:
        - name: page
          in: query
          description: page number.
          schema:
            type: integer
            default: 0
        - name: itemsPerPage
          in: query
          description: items per page.
          schema:
            type: integer
            default: 100
        - name: path
          in: query
          description: filter by path name. Matches "[path NAME]", "[muxer NAME]", and messages that mention that path.
          schema:
            type: string
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/metrics/system:
    get:
      operationId: systemMetrics
      tags: [General]
      summary: returns host CPU, memory, disk and network metrics.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/system/restart:
    post:
      operationId: systemRestart
      tags: [General]
      summary: Gracefully stops the process and starts it again.
      description: The HTTP response is sent before the process is replaced. In-memory state is lost; the DVR index is flushed to disk.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/system/upgrade:
    get:
      operationId: systemUpgradeGet
      tags: [General]
      summary: Checks whether a newer official release is available.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        "400":
          description: the running binary is not an official release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no official releases were found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: systemUpgrade
      tags: [General]
      summary: Downloads the latest official release, replaces the executable, then restarts.
      description: If the process is already up to date, no restart is performed. Development builds cannot be upgraded.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        "400":
          description: the running binary is not an official release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no official releases were found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/auth/jwks/refresh:
    post:
      operationId: authJwksRefresh
      tags: [Authentication]
      summary: Manually refreshes the JWT JWKS.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/global/get:
    get:
      operationId: configGlobalGet
      tags: [Configuration]
      summary: returns the global configuration.
      description: ""
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalConf"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/global/patch:
    patch:
      operationId: configGlobalSet
      tags: [Configuration]
      summary: patches the global configuration.
      description: all fields are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalConf"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/path-defaults/get:
    get:
      operationId: configPathDefaultsGet
      tags: [Configuration]
      summary: returns the default path configuration.
      description: ""
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathConf"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/path-defaults/patch:
    patch:
      operationId: configPathDefaultsPatch
      tags: [Configuration]
      summary: patches the default path configuration.
      description: all fields are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathConf"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/list:
    get:
      operationId: configPathsList
      tags: [Configuration]
      summary: returns all path configurations.
      description: ""
      parameters:
        - name: page
          in: query
          description: page number.
          schema:
            type: integer
            default: 0
        - name: itemsPerPage
          in: query
          description: items per page.
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathConfList"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/get/{name}:
    get:
      operationId: configPathsGet
      tags: [Configuration]
      summary: returns a path configuration.
      description: ""
      parameters:
        - name: name
          in: path
          required: true
          description: the name of the path.
          schema:
            type: string
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathConf"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: path not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/add/{name}:
    post:
      operationId: configPathsAdd
      tags: [Configuration]
      summary: adds a path configuration.
      description: all fields are optional.
      parameters:
        - name: name
          in: path
          required: true
          description: the name of the path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathConf"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/patch/{name}:
    patch:
      operationId: configPathsPatch
      tags: [Configuration]
      summary: patches a path configuration.
      description: all fields are optional.
      parameters:
        - name: name
          in: path
          required: true
          description: the name of the path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathConf"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: path not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/replace/{name}:
    post:
      operationId: configPathsReplace
      tags: [Configuration]
      summary: replaces all values of a path configuration.
      description: all fields are optional.
      parameters:
        - name: name
          in: path
          required: true
          description: the name of the path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathConf"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: path not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/config/paths/delete/{name}:
    delete:
      operationId: configPathsDelete
      tags: [Configuration]
      summary: removes a path configuration.
      description: ""
      parameters:
        - name: name
          in: path
          required: true
          description: the name of the path.
          schema:
            type: string
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: path not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/discover/start:
    post:
      operationId: onvifDiscoverStart
      tags: [ONVIF]
      summary: starts an ONVIF discovery scan.
      description: The body is empty. Duration and interface come from onvifDiscoveryTimeout and onvifDiscoveryInterface. Poll /v3/onvif/discover/result while running is true.
      responses:
        "200":
          description: the scan has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifDiscovery"
        "409":
          description: ONVIF is disabled, or a scan is already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/discover/stop:
    post:
      operationId: onvifDiscoverStop
      tags: [ONVIF]
      summary: stops the discovery scan.
      description: Returns the cameras found so far. The body is empty.
      responses:
        "200":
          description: the scan has stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifDiscovery"
        "409":
          description: ONVIF is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/discover/result:
    get:
      operationId: onvifDiscoverResult
      tags: [ONVIF]
      summary: returns the current discovery scan.
      description: Cameras are published about once per second while the scan is running.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifDiscovery"
        "409":
          description: ONVIF is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/probe:
    post:
      operationId: onvifProbe
      tags: [ONVIF]
      summary: reads identity, profiles and stream URIs from one camera.
      description: The password is not stored and is not written to the log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnvifProbeRequest"
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifProbe"
        "400":
          description: the body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ONVIF is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: the address is invalid or the camera did not answer within 30s.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/paths/add:
    post:
      operationId: onvifPathsAdd
      tags: [ONVIF]
      summary: creates paths for the streams listed in the request.
      description: |
        An empty streams list is rejected. The owner is the first stream with events true, otherwise the first stream.
        A later add of the same address does not open a second subscription. The new path receives onvifPath pointing at the existing owner.
        If a generated name already exists, the request is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnvifPathsAddRequest"
      responses:
        "200":
          description: the paths were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifPathsAdd"
        "400":
          description: invalid request, or a path name is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ONVIF is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: the camera did not answer the probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v3/onvif/devices:
    get:
      operationId: onvifDevices
      tags: [ONVIF]
      summary: lists cameras derived from paths.
      description: Each item is the path that owns onvifAddress, plus paths linked to it with onvifPath.
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifDeviceList"
        "409":
          description: ONVIF is disabled.
          content:
            application/json:
