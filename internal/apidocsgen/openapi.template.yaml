  /{path}/events.json:
    get:
      operationId: onvifEvents
      tags: [ONVIF]
      servers:
        - url: http://localhost:8877
          description: Compat API address (compatAPIAddress).
      summary: returns stored ONVIF events for a path.
      description: |
        Served by the Compat API, not by port 9997. A path with onvifPath reads the owner journal.
        Time bounds are unix seconds, the same parameters as ranges.json.
        sort orders by the event start. desc is newest first and is the default.
        limit is applied after sorting, so the default keeps the newest events.
      parameters:
        - name: path
          in: path
          required: true
          description: Path name. A name may contain slashes.
          schema:
            type: string
        - name: opened_at_gte
          in: query
          description: Include events at or after this unix time.
          schema:
            type: integer
            format: int64
        - name: opened_at_lt
          in: query
          description: Include events before this unix time.
          schema:
            type: integer
            format: int64
        - name: class
          in: query
          description: motion, line, field, input, tamper, or other.
          schema:
            type: string
        - name: sort
          in: query
          description: asc is oldest first. desc is newest first. Omitted or any other value means desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          description: Maximum number of events. Default 1000, maximum 10000. Applied after sort.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: the request was successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnvifEventList"
        "400":
          description: invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

