name: nightly_binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly_binaries:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/webui-sources
        with:
          token: ${{ secrets.DVRPLAYER_TOKEN || github.token }}

      - run: make binaries

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: binaries
