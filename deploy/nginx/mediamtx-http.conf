# MediaMTX: Control API + Compat API on one HTTPS port.
#
# Enable:
#   ln -s /path/to/mediamtx/deploy/nginx/mediamtx-http.conf /etc/nginx/conf.d/mediamtx.conf
#   nginx -t && systemctl reload nginx
#
# Or from nginx.conf inside http { }:
#   include /path/to/mediamtx/deploy/nginx/mediamtx-http.conf;
#
# In mediamtx.yml bind backends to localhost:
#   api: true
#   apiAddress: 127.0.0.1:9997
#   apiTrustedProxies: [127.0.0.1, ::1]
#   compatAPI: true
#   compatAPIAddress: 127.0.0.1:8877
#   compatAPITrustedProxies: [127.0.0.1, ::1]

server {
    listen 80;
    listen [::]:80;
    server_name dvr.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dvr.example.com;

    ssl_certificate     /etc/ssl/certs/dvr.crt;
    ssl_certificate_key /etc/ssl/private/dvr.key;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Control API: GET/POST/PATCH/DELETE /v3/...
    location ^~ /v3/ {
        proxy_pass http://127.0.0.1:9997;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        client_max_body_size 8m;

        # Uncomment to keep Control API off the public internet:
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Compat API (Flussonic-compatible DVR + live HLS): everything else.
    location / {
        proxy_pass http://127.0.0.1:8877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_redirect off;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }
}
